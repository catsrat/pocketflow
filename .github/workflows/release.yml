name: Release CI

on:
  workflow_dispatch:
  push:
    tags: [ 'v*.*.*' ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: stable
      - name: Install deps
        run: flutter pub get
      - name: Restore keystore (from secrets)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Restoring keystore..."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > ${{ runner.temp }}/pocketflow-keystore.jks
            echo "storeFile=${{ runner.temp }}/pocketflow-keystore.jks" > android/key.properties
            echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> android/key.properties
            echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> android/key.properties
            echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/key.properties
          else
            echo "No keystore provided via secrets; building unsigned AAB for testing."
          fi
      - name: Build AAB
        env:
          JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF8
        run: flutter build appbundle --release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/*.aab

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
  uses: subosito/flutter-action@v2
  with:
    flutter-version: stable        # or specify a concrete version like "3.10.5"
    channel: stable               # optional (keeps explicit)
    cache: true                   # optional, speeds up builds
with:
      flutter-version: stable
      - name: Install deps
        run: flutter pub get
      - name: Build iOS (no codesign)
        run: flutter build ios --no-codesign
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-archive
          path: build/ios/ipa || build/ios/Runner.xcarchive
